name: cube_iii
description: "cube3 - تطبيق الإقامة الجامعية باب الزوار 3"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^8.1.0
  qr_flutter: ^4.1.0
  animated_text_kit: ^4.3.0
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  mobile_scanner: ^7.2.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  http: ^1.6.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  web: ^1.1.0
  web_socket_channel: ^3.0.1
  intl: ^0.20.2
  html: ^0.15.6
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  share_plus: ^13.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
